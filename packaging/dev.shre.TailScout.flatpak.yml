app-id: dev.shre.TailScout

runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: tailscout

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Network access (Tailscale daemon runs on the host)
  - --share=network
  # Tailscale LocalAPI unix socket: /var/run/tailscale/tailscaled.sock
  # and ability to run `tailscale` CLI on the host
  - --talk-name=org.freedesktop.Flatpak
  # D-Bus session for notifications
  - --socket=session-bus
  # Tray / systray if added later
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  # File chooser portal for Taildrop receive path
  - --filesystem=xdg-download
  - --filesystem=home:ro

modules:
  - name: tailscout
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/tailscout/cargo
        RUST_BACKTRACE: "1"
    build-commands:
      # Build release binary
      - cargo build --release
      # Install binary
      - install -Dm755 target/release/tailscout /app/bin/tailscout
      # Install desktop file
      - install -Dm644 packaging/dev.shre.TailScout.desktop /app/share/applications/dev.shre.TailScout.desktop
      # Install scalable icon
      - install -Dm644 packaging/icons/hicolor/scalable/apps/dev.shre.TailScout.svg /app/share/icons/hicolor/scalable/apps/dev.shre.TailScout.svg
      # Install AppStream metainfo
      - install -Dm644 packaging/dev.shre.TailScout.metainfo.xml /app/share/metainfo/dev.shre.TailScout.metainfo.xml
    sources:
      - type: git
        url: https://github.com/shreyam1008/tailScout.git
        tag: v0.1.2
        commit: placeholder-replace-with-actual-commit-sha
      # cargo-sources.json is generated by flatpak-cargo-generator.py
      # Run: python3 flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
      - cargo-sources.json

# NOTE FOR FLATHUB SUBMISSION:
#
# 1. Generate cargo-sources.json:
#    pip install aiohttp toml
#    python3 flatpak-cargo-generator.py Cargo.lock -o packaging/cargo-sources.json
#    Tool: https://github.com/flatpak/flatpak-builder-tools/tree/master/cargo
#
# 2. Replace placeholder commit SHA above with actual git commit SHA for the tag.
#
# 3. TailScout talks to the Tailscale daemon via:
#    - Local API: unix socket at /var/run/tailscale/tailscaled.sock
#    - CLI: `tailscale` binary on the host PATH
#    Flatpak sandbox cannot directly reach host sockets or host binaries.
#    Options:
#      a) Use --talk-name=org.freedesktop.Flatpak + flatpak-spawn --host tailscale ...
#         to proxy CLI calls through the host.
#      b) Request a Flathub exception for host file system access if needed.
#    The current manifest uses option (a). Wrap CLI calls with:
#      flatpak-spawn --host tailscale <args>
#    See: https://docs.flatpak.org/en/latest/flatpak-command-reference.html#flatpak-spawn
#
# 4. Fork https://github.com/flathub/flathub and create:
#    io.github.shreyam1008.TailScout/ (or dev.shre.TailScout/)
#    Submit PR following Flathub submission guide:
#    https://docs.flathub.org/docs/for-app-authors/submission
