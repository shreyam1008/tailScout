name: CI and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true

jobs:
  linux-rust:
    name: Linux Rust GUI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            dbus-x11 \
            procps \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build debug binary
        run: cargo build --locked

      - name: Build release binary
        run: cargo build --locked --release

      - name: Run Linux memory smoke test
        run: scripts/measure-memory.sh
        env:
          TAILSCOUT_MEMORY_LIMIT_MIB: "260"
          TAILSCOUT_MEMORY_SAMPLES: "5"
          TAILSCOUT_MEMORY_SETTLE_SECONDS: "5"

  rust-backend-cross:
    name: Rust backend on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run GUI-free backend tests
        run: cargo test --locked --lib --tests

  windows-native:
    name: Windows WinUI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore platform/windows/TailScout.Windows.sln

      - name: Test Windows core
        shell: pwsh
        run: dotnet test platform/windows/TailScout.Windows.Tests/TailScout.Windows.Tests.csproj -c Release --no-restore

      - name: Build WinUI app
        shell: pwsh
        run: dotnet build platform/windows/TailScout.Windows/TailScout.Windows.csproj -c Release -p:Platform=x64 --no-restore

      - name: Publish WinUI app for memory smoke
        shell: pwsh
        run: |
          dotnet publish platform/windows/TailScout.Windows/TailScout.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -o dist/windows/TailScoutMemory

      - name: Run WinUI memory smoke test
        shell: pwsh
        run: |
          .\platform\windows\scripts\Measure-TailScoutWindowsMemory.ps1 `
            -ExePath .\dist\windows\TailScoutMemory\TailScout.Windows.exe `
            -SettleSeconds 5 `
            -Samples 5 `
            -SampleIntervalMs 1000 `
            -SkipStartupRefresh `
            -BaselineMiB 180

  macos-native:
    name: macOS SwiftUI
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Swift package
        run: swift test
        working-directory: platform/macos

      - name: Build Swift package
        run: swift build -c release
        working-directory: platform/macos

      - name: Run SwiftUI memory smoke test
        run: Scripts/measure_rss.sh --build release --settle 5 --samples 5 --baseline-mib 120
        working-directory: platform/macos

  package-linux:
    name: Package Linux
    runs-on: ubuntu-24.04
    needs: linux-rust
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Package Linux release
        run: scripts/package-release.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/tailscout-linux-x86_64.tar.gz
            dist/tailscout-v*-linux-x86_64.tar.gz

  package-windows:
    name: Package Windows
    runs-on: windows-latest
    needs: windows-native
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish WinUI app
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          dotnet publish platform/windows/TailScout.Windows/TailScout.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -o dist/windows/TailScout
          Compress-Archive `
            -Path dist/windows/TailScout/* `
            -DestinationPath "dist/tailscout-v$version-windows-x64-winui.zip" `
            -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/tailscout-v*-windows-x64-winui.zip

  package-macos:
    name: Package macOS
    runs-on: macos-15
    needs: macos-native
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package macOS app
        run: |
          version="${GITHUB_REF_NAME#v}"
          ARCHES="arm64 x86_64" \
            SIGNING_MODE=adhoc \
            TAILSCOUT_VERSION="$version" \
            TAILSCOUT_BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}" \
            Scripts/package_app.sh release
        working-directory: platform/macos

      - name: Rename macOS artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp platform/macos/.build/app/TailScout-"$version".zip \
            dist/tailscout-v"$version"-macos-universal.zip

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/tailscout-v*-macos-universal.zip

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [package-linux, package-windows, package-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/tailscout-linux-x86_64.tar.gz
            dist/tailscout-v*-linux-x86_64.tar.gz
            dist/tailscout-v*-windows-x64-winui.zip
            dist/tailscout-v*-macos-universal.zip
            dist/SHA256SUMS
