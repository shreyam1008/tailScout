[package]
name = "tailscout"
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
description = "A clean, native Rust GUI for Tailscale on Linux"
license = "MIT"
repository = "https://github.com/shreyam1008/tailScout"
default-run = "tailscout"

[[bin]]
name = "tailscout"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Tests rely on the std library and serde_json only.

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
