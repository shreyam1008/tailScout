name: tailscout
base: core24
version: "0.1.2"
summary: Native Linux GUI for Tailscale
description: |
  TailScout is a clean, native Rust GUI for Tailscale on Linux, built with
  GTK4 and libadwaita. No Electron, no bundled browser.

  Features:
  - View and manage tailnet devices
  - Connect and disconnect
  - Switch Tailscale accounts and tailnets
  - Exit node selection
  - Taildrop send and receive
  - Device detail views
  - Native GNOME-style UI

  Requires Tailscale to be installed and running on the host:
    curl -fsSL https://tailscale.com/install.sh | sh

grade: stable
confinement: strict
icon: packaging/icons/hicolor/scalable/apps/dev.shre.TailScout.svg

architectures:
  - build-on: [amd64]

apps:
  tailscout:
    command: bin/tailscout
    extensions: [gnome]
    plugs:
      - network
      - network-control
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      # Allow running host `tailscale` CLI via system-files or classic if needed
      - home

parts:
  tailscout:
    plugin: rust
    source: .
    build-packages:
      - libgtk-4-dev
      - libadwaita-1-dev
      - pkg-config
      - libssl-dev
    stage-packages:
      - libgtk-4-1
      - libadwaita-1-0
      - libglib2.0-0t64
    override-build: |
      cargo build --release
      install -Dm755 target/release/tailscout $CRAFT_PART_INSTALL/bin/tailscout

  desktop-entry:
    plugin: dump
    source: .
    organize:
      packaging/dev.shre.TailScout.desktop: share/applications/dev.shre.TailScout.desktop
      packaging/icons/hicolor/scalable/apps/dev.shre.TailScout.svg: share/icons/hicolor/scalable/apps/dev.shre.TailScout.svg
      packaging/dev.shre.TailScout.metainfo.xml: share/metainfo/dev.shre.TailScout.metainfo.xml
    stage:
      - share/applications/dev.shre.TailScout.desktop
      - share/icons/hicolor/scalable/apps/dev.shre.TailScout.svg
      - share/metainfo/dev.shre.TailScout.metainfo.xml

# NOTE ON TAILSCALE CLI ACCESS:
# Snap strict confinement cannot reach host binaries like `tailscale`.
# Options:
#   a) Use `confinement: classic` — allows host PATH, easier but requires manual
#      Snap Store review and approval as a classic snap.
#   b) Use network-control interface + call tailscaled LocalAPI directly
#      via the unix socket (needs system-files plug for /var/run/tailscale/).
#   c) Bundle a static tailscale binary inside the snap (large, requires
#      keeping it in sync with host daemon version).
# Recommended path: start with classic confinement during testing,
# then work with Snapcraft reviewers on the right interface for production.
# Change: confinement: classic   and remove plugs that require strict mode.
